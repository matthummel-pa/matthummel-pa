<svg xmlns="http://www.w3.org/2000/svg" width="900" height="232" viewBox="0 0 900 232" role="img" aria-label="Matt Hummel — Full-stack web developer. I build WordPress platforms shops can run themselves, and Power Apps and flows for teams that live in Microsoft 365.">
  <style>
    :root { --bg: transparent; --ink: #0f1c2e; --muted: #5b6b7f; --navy: #0d2e57; --onnavy: #ffffff; --blue: #2c5a95; --sky: #4f8fd4; --line: #d7e0ea; --chip: #f1f5fa; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e6edf3; --muted: #9aa7b8; --navy: #7fb2ff; --onnavy: #0b1220; --blue: #93c5fd; --sky: #bfdbfe; --line: #30363d; --chip: #161b22; } }

    .hi { font: 600 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: var(--blue); letter-spacing: .14em; text-transform: uppercase; }
    .name { font: 800 52px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: var(--ink); letter-spacing: -.035em; }
    .role { font: 600 22px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: var(--navy); letter-spacing: -.01em; opacity: 0; animation: cycle 16.0s ease-in-out infinite; transform-origin: 0 0; }
    .tag { font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: var(--muted); }
    .chip { fill: var(--chip); stroke: var(--line); }
    .dot { fill: var(--sky); }
    .chipt { font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bar { fill: url(#g); }
    @keyframes cycle { 0%, 1.88% { opacity: 0; transform: translateY(8px); } 5.62%, 16.88% { opacity: 1; transform: translateY(0); } 20.00%, 100% { opacity: 0; transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .role { animation: none; opacity: 0; } .role:first-of-type { opacity: 1; } }
  </style>
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0d2e57"/><stop offset="1" stop-color="#4f8fd4"/></linearGradient></defs>
  <text class="hi" x="0" y="18">Hi, I’m</text>
  <text class="name" x="-3" y="66">Matt Hummel</text>
  <rect class="bar" x="0" y="76" width="64" height="4" rx="2"/>
  <text class="role" style="animation-delay:0.0s" x="0" y="96">Full-stack web developer</text><text class="role" style="animation-delay:3.2s" x="0" y="96">Custom WordPress on the Roots stack</text><text class="role" style="animation-delay:6.4s" x="0" y="96">Bedrock · Sage 11 · Trellis · Tailwind CSS</text><text class="role" style="animation-delay:9.6s" x="0" y="96">Microsoft Power Platform — Power Apps · Power Automate</text><text class="role" style="animation-delay:12.8s" x="0" y="96">Open for freelance, contract, or full-time</text>
  <text class="tag" x="0" y="130">I build WordPress platforms shops can run themselves,</text>
  <text class="tag" x="0" y="154">and Power Apps and flows for teams that live in Microsoft 365.</text>
  <g transform="translate(0,176)"><rect width="166" height="30" rx="15" class="chip"/><circle cx="15" cy="15" r="3.5" class="dot"/><text x="26" y="20" class="chipt">Gettysburg, PA</text></g><g transform="translate(176,176)"><rect width="176" height="30" rx="15" class="chip"/><circle cx="15" cy="15" r="3.5" class="dot"/><text x="26" y="20" class="chipt">Remote anywhere</text></g><g transform="translate(362,176)"><rect width="186" height="30" rx="15" class="chip"/><circle cx="15" cy="15" r="3.5" class="dot"/><text x="26" y="20" class="chipt">America/New_York</text></g><g transform="translate(558,176)"><rect width="96" height="30" rx="15" class="chip"/><circle cx="15" cy="15" r="3.5" class="dot"/><text x="26" y="20" class="chipt">PHP 8.3</text></g>
</svg>
