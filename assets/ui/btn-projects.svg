<svg xmlns="http://www.w3.org/2000/svg" width="152" height="46" viewBox="0 0 152 46" role="img" aria-label="Projects">
  <style>
    :root {
      --panel: #ffffff; --panel-line: rgba(7, 26, 51, .10); --accent: #1d6fe0;
      --kick-bg: #0b2a52; --kick-ink: #ffffff;
      --name: #071a33; --role: #2f3a4d; --lede: #2f3a4d;
      --pill: #eef4fc; --pill-line: #dbe9fa; --pill-ink: #0b2a52;
      --btn-surface: #ffffff; --btn-surface-ink: #0a1a33;
    }
    @media (prefers-color-scheme: dark) { :root {
      --panel: #141c28; --panel-line: #243041; --accent: #3b82f6;
      --kick-bg: #1444a8; --kick-ink: #ffffff;
      --name: #ffffff; --role: #c5d0de; --lede: #c5d0de;
      --pill: #172233; --pill-line: #243041; --pill-ink: #93c5fd;
      --btn-surface: #111a28; --btn-surface-ink: #f1f5fb;
    } }

    .halo { fill: none; stroke: #22d3ee; stroke-opacity: .08; stroke-width: 3; }
    .b { fill: var(--btn-surface); stroke: url(#ring); stroke-width: 1.5; }
    .l { font: 700 15px/1 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--btn-surface-ink); letter-spacing: .02em; }
  </style>
  <defs><linearGradient id="ring" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset=".52" stop-color="#22d3ee"/><stop offset="1" stop-color="#a3e635"/></linearGradient></defs>
  <rect class="halo" x="1.5" y="1.5" width="149.0" height="43.0" rx="21.5"/>
  <rect class="b" x="3.75" y="3.75" width="144.5" height="38.5" rx="19.25"/>
  <g transform="translate(19,14) scale(0.75)"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
