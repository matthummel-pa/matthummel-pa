<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Play Git Blocks, a tetris-style commit game">
  <title>Play Git Blocks</title>
  <defs>
    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152033"/>
      <stop offset="100%" stop-color="#0d1522"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a30"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" rx="24" fill="url(#cabinet)" stroke="#243041"/>
  <circle cx="28" cy="26" r="6" fill="#d45d5d"/>
  <circle cx="48" cy="26" r="6" fill="#e7c35a"/>
  <circle cx="68" cy="26" r="6" fill="#3d8b6e"/>
  <text x="360" y="32" text-anchor="middle" fill="#d5deea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">GIT BLOCKS</text>
  <text x="640" y="32" text-anchor="middle" fill="#8ea0b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">LIVE</text>
  <rect x="24" y="52" width="430" height="300" rx="14" fill="url(#screen)" stroke="#243041"/>
  <!-- board grid blocks -->
  <g transform="translate(48,72)">
    <rect x="96" y="0" width="22" height="22" rx="4" fill="#5ec8d8"/>
