  <rect x="516" y="138" width="22" height="22" rx="4" fill="#8b7ce0"/>
  <text x="492" y="220" fill="#8ea0b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">PIECES</text>
  <text x="492" y="244" fill="#d5deea" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">commit ∑ branch ∑ merge</text>
  <text x="492" y="264" fill="#d5deea" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13">hotfix ∑ stash ∑ review</text>
  <text x="492" y="300" fill="#4f8fd4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">TAP TO PLAY í</text>
  <rect x="24" y="366" width="672" height="32" rx="10" fill="#101a2b"/>
  <text x="360" y="387" text-anchor="middle" fill="#9fb4ce" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">ê í move ∑ ë rotate ∑ space drop ∑ C hold</text>
</svg>
