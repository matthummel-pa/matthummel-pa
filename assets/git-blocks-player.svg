    <rect x="264" y="168" width="22" height="22" rx="4" fill="#e08a4a"/>
    <rect x="0" y="216" width="22" height="22" rx="4" fill="#3d8b6e"/>
    <rect x="24" y="216" width="22" height="22" rx="4" fill="#3d8b6e"/>
    <rect x="24" y="192" width="22" height="22" rx="4" fill="#3d8b6e"/>
    <rect x="48" y="216" width="22" height="22" rx="4" fill="#d45d5d"/>
