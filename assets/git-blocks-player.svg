  <circle cx="239" cy="202" r="36" fill="#0d2e57" stroke="#f7f9fc" stroke-width="3"/>
  <polygon points="229,182 259,202 229,222" fill="#f7f9fc"/>
  <rect x="470" y="52" width="226" height="300" rx="14" fill="#101a2b" stroke="#243041"/>
  <text x="492" y="84" fill="#8ea0b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">SCORE</text>
  <text x="492" y="114" fill="#f7f9fc" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">PLAY</text>
  <text x="492" y="150" fill="#8ea0b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">NEXT</text>
  <rect x="492" y="162" width="22" height="22" rx="4" fill="#8b7ce0"/>
  <rect x="516" y="162" width="22" height="22" rx="4" fill="#8b7ce0"/>
