    <rect x="120" y="72" width="22" height="22" rx="4" fill="#8b7ce0"/>
    <rect x="144" y="72" width="22" height="22" rx="4" fill="#8b7ce0"/>
    <rect x="168" y="72" width="22" height="22" rx="4" fill="#8b7ce0"/>
    <rect x="48" y="168" width="22" height="22" rx="4" fill="#4f8fd4"/>
