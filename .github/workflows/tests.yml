name: Profile tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "game/**"
      - ".github/scripts/**"
      - "tests/**"
      - "assets/**"

jobs:
  test:
    name: README, activity, and Git Blocks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Git Blocks engine tests
        run: node --test tests/test_git_blocks.js
